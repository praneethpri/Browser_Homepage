<div class="main-div">
  <app-search-bar></app-search-bar>
  <div class="clocks-and-links">
    <app-clock></app-clock>
    <app-links></app-links>
  </div>
  <app-control-buttons
    (notifyParentPlus)="showAddLinkPlusFunc($event)"
  ></app-control-buttons>
  <app-add-link
    (notifyToShow)="showAddLinkFunc($event)"
    (reRenderLinks)="renderAgain()"
    *ngIf="showAddLink"
  ></app-add-link>
</div>
